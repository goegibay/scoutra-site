<!-- @dsCard group="Core components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}</style></head><body>
<h3 class="ds-h3" style="margin-bottom:14px">Metric cards — radius 14px</h3>
<div class="grid">
<div class="card metric-card"><div class="metric-label">Verified creators</div><div class="metric-value">118</div><div class="metric-delta up">↑ 12 this week</div></div>
<div class="card metric-card"><div class="metric-label">In verification queue</div><div class="metric-value">249</div><div class="metric-delta">est. 3 weeks</div></div>
<div class="card metric-card"><div class="metric-label">Email rot detected</div><div class="metric-value">4</div><div class="metric-delta down">↓ removed from list</div></div>
</div>
<div class="card interactive" style="margin-top:16px;max-width:420px"><h3 class="ds-h3">Interactive card</h3><p class="caption" style="margin:4px 0 0">hover：border 變深＋1px 上移，無陰影無放大。</p></div>
</body></html>
