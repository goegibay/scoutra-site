<!-- @dsCard group="Core components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}</style></head><body>
<h3 class="ds-h3" style="margin-bottom:14px">Inputs</h3>
<div class="cols">
<div class="field"><label class="field-label">App Store URL</label><input class="input" placeholder="https://apps.apple.com/…"><span class="hint">貼上你的 App 連結開始掃描</span></div>
<div class="field"><label class="field-label">Niche</label><select class="select"><option>Japanese learning</option><option>Fitness</option></select></div>
<div class="field"><label class="field-label">Email（error）</label><input class="input error" value="not-an-email"><span class="hint error-text">請輸入有效的 email</span></div>
<div class="field"><label class="field-label">Disabled</label><input class="input" disabled value="Locked on free plan"></div>
</div>
</body></html>
