<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>.sw{display:flex;align-items:center;gap:12px;margin-bottom:8px}.chip{width:44px;height:32px;border-radius:8px;border:1px solid var(--border)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px}</style></head><body>
<h3 class="ds-h3" style="margin-bottom:16px">Color tokens</h3>
<div class="grid">
<div class="sw"><span class="chip" style="background:var(--primary)"></span><div><b>--primary</b> #4338ca<div class="caption">主要操作色（深靛藍）</div></div></div>
<div class="sw"><span class="chip" style="background:var(--accent)"></span><div><b>--accent</b> #0d9488<div class="caption">accent 候選（teal）</div></div></div>
<div class="sw"><span class="chip" style="background:var(--foreground)"></span><div><b>--foreground</b> #0f172a</div></div>
<div class="sw"><span class="chip" style="background:var(--muted-foreground)"></span><div><b>--muted-foreground</b> #64748b</div></div>
<div class="sw"><span class="chip" style="background:var(--surface)"></span><div><b>--surface</b> #f8fafc</div></div>
<div class="sw"><span class="chip" style="background:var(--border)"></span><div><b>--border</b> #e2e8f0</div></div>
<div class="sw"><span class="chip" style="background:var(--success)"></span><div><b>--success</b></div></div>
<div class="sw"><span class="chip" style="background:var(--warning)"></span><div><b>--warning</b></div></div>
<div class="sw"><span class="chip" style="background:var(--danger)"></span><div><b>--danger</b></div></div>
<div class="sw"><span class="chip" style="background:var(--info)"></span><div><b>--info</b></div></div>
</div>
<p class="caption" style="margin-top:12px">Charts: <span class="chip" style="display:inline-block;width:20px;height:14px;background:var(--chart-1)"></span> <span class="chip" style="display:inline-block;width:20px;height:14px;background:var(--chart-2)"></span> <span class="chip" style="display:inline-block;width:20px;height:14px;background:var(--chart-3)"></span> <span class="chip" style="display:inline-block;width:20px;height:14px;background:var(--chart-4)"></span> <span class="chip" style="display:inline-block;width:20px;height:14px;background:var(--chart-5)"></span></p>
</body></html>
