<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>.bar{background:var(--ring-soft);border-left:3px solid var(--primary);height:20px;margin-bottom:6px;display:flex;align-items:center;padding-left:8px;font-size:12px;color:var(--muted-foreground)}</style></head><body>
<h3 class="ds-h3" style="margin-bottom:12px">Spacing scale（4 的倍數）</h3>
<div class="bar" style="width:4px"></div><div class="bar" style="width:8px"></div>
<div class="bar" style="width:12px"></div><div class="bar" style="width:16px">16</div>
<div class="bar" style="width:24px">24</div><div class="bar" style="width:32px">32</div>
<div class="bar" style="width:48px">48</div><div class="bar" style="width:64px">64</div>
<h3 class="ds-h3" style="margin:20px 0 12px">Radius</h3>
<div style="display:flex;gap:16px">
  <div class="card" style="width:130px;text-align:center"><b>14px</b><div class="caption">cards</div></div>
  <div style="border:1px solid var(--border);border-radius:var(--radius-control);padding:20px;width:130px;text-align:center"><b>8px</b><div class="caption">controls</div></div>
</div>
<p class="caption" style="margin-top:12px">1px 中性邊框、極少陰影；hover 只允許 border-color ＋ 1px 上移。</p>
</body></html>
