<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{padding:0}.hero{padding:72px 48px;text-align:center;background:linear-gradient(180deg,var(--surface),var(--background))}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);background:var(--ring-soft);border-radius:999px;padding:4px 14px;margin-bottom:20px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.02em;margin:0 0 16px}
.hero p{font-size:17px;color:var(--muted-foreground);max-width:520px;margin:0 auto 28px}
.cta{display:flex;gap:12px;justify-content:center}</style></head><body>
<div class="hero">
<span class="eyebrow">Direction A — Light / Indigo</span>
<h1>Find creators who can<br>actually move your app</h1>
<p>Scoutra finds, verifies, and keeps monitoring the creators in your niche. Every recommendation ships with evidence — not a list, a pipeline.</p>
<div class="cta"><button class="btn btn-primary" style="padding:12px 24px;font-size:15px">Start free scan</button><button class="btn btn-secondary" style="padding:12px 24px;font-size:15px">See a sample report</button></div>
</div>
</body></html>
