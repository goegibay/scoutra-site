<!-- @dsCard group="Patterns — Hero 二選一" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{padding:0}.hero{padding:72px 48px;text-align:center;background:var(--dark-background);color:var(--dark-foreground)}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dark-accent);border:1px solid color-mix(in srgb,var(--dark-accent) 35%,transparent);border-radius:999px;padding:4px 14px;margin-bottom:20px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.02em;margin:0 0 16px}
.hero h1 em{font-style:normal;color:var(--dark-accent)}
.hero p{font-size:17px;color:var(--dark-muted);max-width:520px;margin:0 auto 28px}
.cta{display:flex;gap:12px;justify-content:center}
.btn-teal{background:var(--dark-accent);color:#04211d}.btn-teal:hover{filter:brightness(1.08)}
.btn-outline{background:transparent;color:var(--dark-foreground);border-color:#334155}.btn-outline:hover{border-color:var(--dark-muted)}</style></head><body>
<div class="hero">
<span class="eyebrow">Direction B — Dark / Teal（佔位頁血統）</span>
<h1>Find creators who can<br>actually <em>move your app</em></h1>
<p>Scoutra finds, verifies, and keeps monitoring the creators in your niche. Every recommendation ships with evidence — not a list, a pipeline.</p>
<div class="cta"><button class="btn btn-teal" style="padding:12px 24px;font-size:15px">Start free scan</button><button class="btn btn-outline" style="padding:12px 24px;font-size:15px">See a sample report</button></div>
</div>
</body></html>
